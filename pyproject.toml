[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "osrs-price-forecaster"
version = "0.1.0"
description = "Local-first OSRS Grand Exchange price tracking and forecasting foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "osrs-price-forecaster contributors" }]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "structlog>=25.4.0,<26.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
  "mypy>=1.17.0,<2.0.0",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osrs_price_forecaster"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests that require database or containerized dependencies",
  "contract: marks external API contract tests that must use fixtures/mocks"
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "N", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/osrs_price_forecaster/api/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
plugins = []
mypy_path = "src"

[tool.coverage.run]
source = ["osrs_price_forecaster"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
