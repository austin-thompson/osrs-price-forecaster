services:
  postgres:
    image: postgres:16
    container_name: osrs-postgres
    environment:
      POSTGRES_DB: osrs_price_forecaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osrs_price_forecaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: osrs-api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/osrs_price_forecaster
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "osrs_price_forecaster.main:app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  collector:
    build: .
    container_name: osrs-collector
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/osrs_price_forecaster
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["uv", "run", "python", "-m", "osrs_price_forecaster.workers.collector"]
    profiles: ["workers"]

  forecaster:
    build: .
    container_name: osrs-forecaster
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/osrs_price_forecaster
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["uv", "run", "python", "-m", "osrs_price_forecaster.workers.forecaster"]
    profiles: ["future"]

volumes:
  postgres_data:
